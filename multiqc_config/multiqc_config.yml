title: "Read QC"

report_header_info:
  - Pipeline: "{{pipeline_name}}"
  - Version: "{{pipeline_version}}"
  - Help contact: "https://sanger.freshservice.com/support/catalog/items/426"

export_plots: true
disable_version_detection: true

fn_clean_exts: ".prefilter"

run_modules:
  - fastqc
  - kraken
  - sylphtax

module_order:
  - fastqc:
      name: "FastQC"
      info: "This section of the report shows FastQC results."
      path_filters:
        - "*.zip"
  - kraken:
      name: "Kraken2"
      info: "This section of the report shows Kraken2 classification results."
  - sylphtax:
      name: "Sylphtax"
      info: "This section of the report shows sylphtax classification results."

module_settings:
  kraken:
    top_n: 5
    title: "Read QC"
  sylphtax:
    top_n: 10

sp:
  kraken:
    fn: "*.tsv"
  sylphtax:
    fn: "*.sylphmpa"
